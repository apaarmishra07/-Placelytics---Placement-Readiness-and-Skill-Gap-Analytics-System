kind = "web"
previewPath = "/"
title = "Placelytics"
version = "1.0.0"
id = "artifacts/placelytics"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19615

[services.development]
run = "pnpm --filter @workspace/placelytics run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/placelytics", "run", "build" ]
publicDir = "artifacts/placelytics/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19615"
BASE_PATH = "/"
